name: Proca Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    # Postgres and RabbitMQ for the tests, matching production's versions
    # (Postgres 18, RabbitMQ 4.0). citext is created by the migrations themselves.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: proca
          POSTGRES_PASSWORD: proca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4.0
        env:
          RABBITMQ_DEFAULT_USER: proca
          RABBITMQ_DEFAULT_PASS: proca
          RABBITMQ_DEFAULT_VHOST: proca
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          version-file: .tool-versions
      # deps + compiled _build. The key includes .tool-versions so an
      # Elixir/Erlang upgrade never reuses artifacts built with the old version.
      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Setup app db (migrate)
        run: mix ecto.setup
        env:
          MIX_ENV: test

      - name: Run tests
        run: mix test
